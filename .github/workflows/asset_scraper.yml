name: Asset Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *" # midnight EST, daily 05:00 UTC

permissions:
  contents: write

jobs:
    scrape_card:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: "3.12.5"

            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt

            - name: Figure out missing cards
              id: discover
              run : |
                echo "Finding missing cards..."

                # First figure out missing cards
                result=$(python card_scraper_script.py \
                  --task "extract missing cards")

                # Echo results
                echo "$result"

                # Write outputs for later steps
                start_index=$(echo "$result" | grep start_index | cut -d= -f2)
                end_index=$(echo "$result" | grep end_index | cut -d= -f2)
                echo "start_index=$start_index" >> $GITHUB_OUTPUT
                echo "end_index=$end_index" >> $GITHUB_OUTPUT

            - name: Scrape card images and information
              if: ${{ steps.discover.outputs.start_index != '' || steps.discover.outputs.end_index != '' }}
              run: |
                echo "Scraping card images and collecting info from sekai.best and sekaipedia..."
                python card_scraper_script.py \
                --start_card ${{ steps.discover.outputs.start_index }} \
                --end_card ${{ steps.discover.outputs.end_index }} \
                --task "scrape card info"

            - name: Reorder card_metadata.json, generate individual card .json files
              if: ${{ steps.discover.outputs.start_index != '' || steps.discover.outputs.end_index != '' }}
              run: |
                echo "Reordering card_metadata.json and generating individual card files..."
                python card_scraper_script.py \
                --task "reorder card info"

    scrape_gacha:
        needs: scrape_card
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: "3.12.5"

            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt

            - name: Figure out missing gachas
              id: discover
              run : |
                echo "Finding missing gachas..."

                # First figure out missing gachas
                result=$(python gacha_scraper_script.py \
                  --task "extract missing gachas")

                # Echo results
                echo "$result"

                # Write outputs for later steps
                start_index=$(echo "$result" | grep start_index | cut -d= -f2)
                end_index=$(echo "$result" | grep end_index | cut -d= -f2)
                echo "start_index=$start_index" >> $GITHUB_OUTPUT
                echo "end_index=$end_index" >> $GITHUB_OUTPUT

            - name: Scrape gacha information
              if: ${{ steps.discover.outputs.start_index != '' || steps.discover.outputs.end_index != '' }}
              run: |
                echo "Collecting gacha info from sekai.best and sekaipedia..."
                python gacha_scraper_script.py \
                --start_gacha ${{ steps.discover.outputs.start_index }} \
                --end_gacha ${{ steps.discover.outputs.end_index }} \
                --task "scrape gacha info"
            
            - name: Reorder gacha_metadata.json, generate individual gacha .json files
              if: ${{ steps.discover.outputs.start_index != '' || steps.discover.outputs.end_index != '' }}
              run: |
                echo "Reordering gacha_metadata.json and generating individual gacha files..."
                python gacha_scraper_script.py \
                --task "reorder gacha info"
            
            - name: Scrape gacha assets
              if: ${{ steps.discover.outputs.start_index != '' || steps.discover.outputs.end_index != '' }}
              run: |
                echo "Scraping gacha assets (logo, background, etc.) ..."
                python gacha_scraper_script.py \
                --start_gacha ${{ steps.discover.outputs.start_index }} \
                --end_gacha ${{ steps.discover.outputs.end_index }} \
                --task "scrape gacha assets"

            - name: Commit and push results for both jobs
              if: ${{ steps.discover.outputs.start_index != '' || steps.discover.outputs.end_index != '' }}
              run: |
                git config user.name "github-actions[bot]"
                git config user.email "github-actions[bot]@users.noreply.github.com"
                git add .
                git commit -m "Update scraped gacha assets [skip ci]" || echo "No changes to commit"
                git push
